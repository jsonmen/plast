[package]
name = "plast"
version = "0.1.0"
edition = "2024"
description = "A high-performance data pipeline designed to pretokenize datasets and stream them directly to your training loop with zero-copy memory mapping."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jsonmen/plast"
readme = "README.md"
keywords = ["machine-learning", "data-loader", "mmap", "tokenization", "deep-learning"]
categories = ["science", "algorithms"]

[lib]
name = "plast"
path = "src/lib.rs"

[[bench]]
name = "data_pipeline_benches"
harness = false
required-features = ["full"]

[features]
dataloader = []

pretokenizer = [
    "dep:tokenizers",
    "dep:crossbeam-channel",
    "dep:rayon",
    "dep:bytemuck",
    "dep:log",
    "dep:polars",
]

mmap-storage = [
    "dep:memmap2",
]

experimental-buffer-storage = [
    "dep:crossbeam-channel",
    "dep:memmap2",
]

burn = [
    "dataloader",
    "dep:burn-tensor",
]

legacy = ["dep:memmap2", "dep:bytemuck"]

full = [
    "dataloader",
    "pretokenizer",
    "mmap-storage",
    "burn",
]

[dependencies]
# --- Core Always-Required Dependencies ---
bytes = "1.12.1"
thiserror = "2.0.18"

# --- Feature-Gated Optional Dependencies ---
burn-tensor = { version = "0.21.0", optional = true }
bytemuck = { version = "1.25.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
log = { version = "0.4.32", optional = true }
memmap2 = { version = "0.9.10", optional = true }
polars = { version = "0.54.2", optional = true, features = ["lazy", "strings", "ipc", "parquet", "ipc_streaming", "performant", "json", "csv"] }
rayon = { version = "1.12.0", optional = true }
tokenizers = { version = "0.23.1", optional = true }

[dev-dependencies]
criterion = "0.8.2"
cudarc = { version = "0.19.8", features = ["cuda-12090"] }
env_logger = "0.11.10"
tempfile = "3.27.0"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
debug = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
